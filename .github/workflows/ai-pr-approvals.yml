name: AI PR approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

# One run at a time per pull request. A newer event cancels an older run so two events seconds apart
# cannot finish out of order and leave a stale result on the commit.
concurrency:
  group: ai-pr-approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  statuses: write

jobs:
  evaluate:
    name: Evaluate
    runs-on: ubuntu-latest
    steps:
      # The script that counts approvals is loaded from the default branch. This workflow file is not:
      # GitHub runs it from the pull request's own copy, which is why the script fails closed when a
      # pull request edits the gate and why CODEOWNERS covers .github/workflows.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            // The script comes from the default branch and this file from the pull request, so they can differ.
            const gate = require('./scripts/check-ai-pr-approvals.js');
            const { evaluate } = gate;
            const candidateApprovers = gate.candidateApprovers || (() => []);
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...context.repo, pull_number: number });
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: number });
            // A reviewer only counts with write access or better. Lookup failure means they do not count.
            const permissions = new Map();
            for (const username of candidateApprovers(reviews)) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
                permissions.set(username, data.permission);
              } catch (e) {
                core.warning(`Could not read permission for ${username}: ${e.message}`);
              }
            }
            const result = evaluate(pr, reviews, files, permissions);
            core.info(result.reason);
            // The commit status is the required check. The ruleset pins it to the GitHub Actions app,
            // so a status posted by a person's token does not satisfy the rule.
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'AI PR approvals',
              state: result.pass ? 'success' : 'failure',
              description: result.reason.slice(0, 140),
            });
