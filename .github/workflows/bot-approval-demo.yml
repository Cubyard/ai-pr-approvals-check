name: Bot approval demo

# Manual only. Has github-actions[bot] submit an approving review on a pull request,
# to show that a bot's approval does not count toward the AI PR approvals check.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.createReview({
              ...context.repo,
              pull_number: Number('${{ inputs.pr }}'),
              event: 'APPROVE',
              body: 'Demo: this approval comes from a bot account and should not count.',
            });
